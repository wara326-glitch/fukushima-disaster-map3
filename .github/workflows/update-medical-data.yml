name: Update Fukushima medical data

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_medical_data.py"
      - ".github/workflows/update-medical-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 3 2 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: pip install openpyxl
      - name: Build Fukushima medical dataset
        run: python scripts/build_medical_data.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fukushima_medical.json data/build-meta.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update Fukushima medical facility data"
            git push
          fi
